  <style>
    :root { color-scheme: light dark; --text: #1f2937; --muted: #6b7280; --bg: #ffffff; --accent: #d63939; }

    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; }

  </main>

</html>
